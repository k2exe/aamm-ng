name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
      - name: Verify only password hashing from crypto is used
        run: scripts/check-crypto.sh
      - name: Report stripped binary sizes
        run: |
          set -euo pipefail
          for arch in amd64 arm64 arm mips mipsle; do
            for cmd in aamm-ng aamm-ng-web; do
              CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" GOMIPS=softfloat GOARM=7 \
                go build -trimpath -ldflags="-s -w" -o "/tmp/${cmd}-${arch}" "./cmd/${cmd}"
            done
          done
          ls -l /tmp/aamm-ng-* | awk '{printf "%10d  %s\n", $5, $9}' | tee -a "$GITHUB_STEP_SUMMARY"
